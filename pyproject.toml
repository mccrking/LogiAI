[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logiai"
version = "0.1.0"
description = "Prediction du risque de retard des livraisons"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "build>=1.2"]

[project.scripts]
logiai-predict = "logiai.cli:main"

[tool.setuptools.packages.find]
include = ["logiai*"]

[tool.setuptools]
include-package-data = false
